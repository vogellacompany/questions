categoryId: 8337 # CATEGORY NAME
name: Good practices in Git
questions:
  - description: How should a commit message be?
    choices:
      - It should include the changed code 
      - It doesn't matter because you know what you changed in the commit 
      - It should be descriptive and informative without repeating the code changes 
      - It should be no longer than 10 words
    hint:
    explanation: The commit message can be read by everyone who has access to the repository and it should be written in a way that it is clear to everyone what the changes of the commit are.
    correctChoice: 2
  - description: Which sections can a commit message have?
    type: MULTIPLE_CHOICE
    choices:
      - A short summary line named header
      - A longer description named body
      - A footer with metadata as key-value pairs
      - A copy of the changed code
    hint:
    explanation: The header ensures that the change is displayed well on command line or graphical tools. The body describes the reason for the change. The footer can contain metadata as key-value pairs. The changed code is already part of the commit and does not belong into the message.
    correctChoices: [0, 1, 2]