categoryId: 89777 # CATEGORY NAME
name: Using Assert Frameworks
questions:
  - description: What is the Hamcrest matcher framework?
    choices:
      - It is a framework which creates unit tests automatically
      - It is a framework to run units tests 
      - It is a framework which provides matcher methods for asserting conditions in your tests
      - It is a framework which classifies init tests  
    hint:
    explanation: The Hamcrest matcher framework provides additional matcher classes which can be used in tests for example written with JUnit. You can also define custom matcher implementations.
    correctChoice: 2
  - description: What is AssertJ?
    choices:
      - It is a framework which creates unit tests automatically
      - It is a framework which classifies init tests
      - It is a framework to run units tests 
      - It is a framework which provides matcher methods for asserting conditions in your tests
    hint: 
    explanation: 
    correctChoice: 3
  - description: What is the purpose of using Hamcrest or AssertJ?
    type: MULTIPLE_CHOICE
    choices:
      - Make test code easier to read
      - Make test code easier to write
      - Produce more descriptive failure messages
      - Make tests run faster
    hint: 
    explanation: Fluent matchers read like sentences, are easy to discover via code completion and describe the mismatch in detail if an assertion fails. They do not affect the execution speed of tests.
    correctChoices: [0, 1, 2]
  
