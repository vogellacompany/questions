categoryId: 1705
name: Creating and using custom extension points
questions:
  - description: Which statement describes the relationship between an extension point and an extension?
    choices:
      - Both are defined in the MANIFEST.MF file
      - An extension defines an API, and the extension point is the contribution to it
      - An extension point defines a contract, and extensions contribute to it
      - An extension point can have only one extension
    hint: One plug-in offers a hook, and other plug-ins plug into it.
    explanation: The plug-in with the extension point defines the contract and evaluates the contributions. Other plug-ins provide extensions based on this contract, and there can be many of them.
    correctChoice: 2
  - description: Which file describes the contract and the allowed elements and attributes of an extension point?
    choices:
      - The feature.xml file
      - The build.properties file
      - A schema file with the .exsd extension
      - A .e4xmi model file
    hint: The plugin.xml file references this file in the schema attribute of the extension point.
    explanation: The .exsd file is an XML schema that defines the elements and attributes of the extension point. PDE offers a schema editor for it.
    correctChoice: 2
  - description: Which service gives you access to all extension points and extensions of the running application?
    choices:
      - IBundleGroupProvider
      - IPresentationEngine
      - IExtensionRegistry
      - IEclipseContext
    hint: The name of the interface contains the word registry.
    explanation: The IExtensionRegistry stores the information about all extension points and extensions. It can be injected or obtained via the Platform class.
    correctChoice: 2
  - description: Which method of IConfigurationElement creates the object that is referenced by a java-typed attribute such as class?
    choices:
      - getContributor
      - createExecutableExtension
      - getChildren
      - getAttribute
    hint: The name of the method says that the result is something you can run.
    explanation: createExecutableExtension loads the class named in the attribute using the class loader of the contributing plug-in and creates an instance of it.
    correctChoice: 1
  - description: Why should the defining plug-in execute the code of an extension via an ISafeRunnable and SafeRunner?
    choices:
      - Because SafeRunner is required to load the class of the extension
      - Because an exception in one extension should not break the others or the defining plug-in
      - Because extensions can only be called from the UI thread
      - Because the extension code is executed in a separate OSGi framework
    hint: The code in the extension comes from other plug-ins, which you do not control.
    explanation: SafeRunner catches exceptions thrown by contributed code and reports them, so the remaining extensions are still executed.
    correctChoice: 1
  - description: Which statements about extension factories are correct?
    type: MULTIPLE_CHOICE
    choices:
      - They implement the IExecutableExtensionFactory interface
      - They help if the class of an extension has no default constructor
      - They are referenced in the class attribute of the extension
      - They replace the need for a schema file
    hint: The default way of creating an extension object requires a certain constructor.
    explanation: createExecutableExtension requires a default constructor. A factory implementing IExecutableExtensionFactory is referenced in the class attribute of the extension and creates the object instead. A schema file is still useful.
    correctChoices: [0, 1, 2]
  - description: What must the plug-in that defines an extension point do so that contributing plug-ins can implement its interface?
    choices:
      - Mark the plug-in as a fragment
      - Add the interface to the build.properties file
      - Export the package that contains the interface in the MANIFEST.MF file
      - Register the interface in the Application.e4xmi file
    hint: Other bundles can only see packages that are made visible.
    explanation: A contributing plug-in needs access to the interface, for example IGreeter, so the defining plug-in must export its package. The contributing plug-in also declares a dependency on the defining plug-in.
    correctChoice: 2
  - description: Which setting is recommended for plug-ins that contribute extensions or define extension points?
    choices:
      - Disabling the lazy activation
      - Setting the Bundle-Version to 0.0.0
      - Marking the plug-in as a singleton
      - Placing it in the default package
    hint: Extension points are identified by plug-in id, so only one version of the id may be active.
    explanation: The extension registry requires that a plug-in with extensions is a singleton, which is set with the singleton directive on the Bundle-SymbolicName header.
    correctChoice: 2
