categoryId: 1706
name: The renderer framework
questions:
  - description: What is the main responsibility of a renderer in the Eclipse 4 renderer framework?
    choices:
      - It translates the texts of the application model
      - It stores the application model in the Application.e4xmi file
      - It resolves the dependencies between OSGi bundles
      - It creates the UI objects for model elements and reacts to changes in them
    hint: The application model is only a description, so something has to turn it into widgets.
    explanation: A renderer creates the UI objects, such as SWT widgets, for the model elements and monitors and applies changes of these elements.
    correctChoice: 3
  - description: Which class is the default renderer factory of Eclipse RCP applications?
    choices:
      - WorkbenchRendererFactory
      - SWTRendererRegistry
      - DefaultUIFactory
      - ModelRendererProvider
    hint: It lives in the org.eclipse.e4.ui.workbench.renderers.swt plug-in.
    explanation: WorkbenchRendererFactory returns the SWT-based renderers, for example a ContributedPartRenderer for MPart elements.
    correctChoice: 0
  - description: Which method of a renderer factory returns the renderer for a model element?
    choices:
      - resolveRenderer
      - findRenderer
      - createRenderer
      - getRenderer
    hint: The factory implements the IRendererFactory interface and returns an AbstractPartRenderer.
    explanation: IRendererFactory declares getRenderer(MUIElement, Object parent). A custom factory typically overrides it and delegates to the super implementation for all other element types.
    correctChoice: 3
  - description: How do you register a custom renderer factory for your product?
    choices:
      - By adding the factory class to the Application.e4xmi file as add-on
      - By setting the renderer property in the build.properties file
      - By implementing the IRendererFactory interface in the lifecycle class
      - By adding the rendererFactoryUri property to the product extension in plugin.xml
    hint: Products also use properties to define the CSS file and the lifecycle class.
    explanation: The org.eclipse.core.runtime.products extension accepts the rendererFactoryUri property, whose value is a bundleclass URI pointing to the factory class.
    correctChoice: 3
  - description: How can you use a custom renderer for only one specific model element, such as one part?
    choices:
      - By adding a tag with the class name of the renderer
      - By adding the Custom Renderer key to the persisted state of the element with the renderer URI as value
      - By overriding the toString method in the part
      - By setting the contributionURI of the element to the renderer class
    hint: The IPresentationEngine defines a constant for the key, and the value is a URI.
    explanation: The IPresentationEngine.CUSTOM_RENDERER_KEY constant has the value Custom Renderer. If it is set in the persisted state of an element, the engine uses the renderer from the given URI.
    correctChoice: 1
  - description: Which statements about the tags and constants of the IPresentationEngine are correct?
    type: MULTIPLE_CHOICE
    choices:
      - The MAXIMIZED tag removes the model element from the application
      - The STANDALONE tag on a part stack lets it show a single part which cannot be dragged out
      - The NO_MOVE tag collapses a container automatically when it is empty
      - The NO_AUTO_COLLAPSE tag keeps a container visible when its last child is removed
    hint: Containers collapse by default when they are empty, and a few tags change that behavior.
    explanation: STANDALONE restricts a stack to a single part, and NO_AUTO_COLLAPSE keeps an empty container. NO_MOVE prevents moving an element, and MAXIMIZED only maximizes a stack.
    correctChoices: [1, 3]
  - description: What is required if you want to render an existing application with a different UI toolkit such as JavaFX?
    choices:
      - Nothing, SWT parts work in every renderer
      - Only the Application.e4xmi file must be rewritten
      - Only the CSS files must be converted
      - A renderer for that toolkit, and the SWT-based parts must be re-implemented
    hint: Parts create SWT widgets in their methods.
    explanation: The services and the application model can be reused, but the part classes create toolkit specific widgets and must be rewritten for the new toolkit.
    correctChoice: 3
  - description: Which type creates and populates the local IEclipseContext for model elements that implement MContext, for example an MPart?
    choices:
      - The renderer of the element
      - The part class itself
      - The EModelService
      - The OSGi service registry
    hint: The context must exist before dependency injection can happen into the part class.
    explanation: The renderer is responsible for the context handling of the model elements. The ContributedPartRenderer, for example, adds the Composite to the local context of a part.
    correctChoice: 0
